apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# A rota pública de traces é a mesma do local; só o host muda.
resources:
  - ../otlp

patches:
  - target:
      kind: Ingress
      name: otlp
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: l2-mk6a4.brazilsouth.cloudapp.azure.com
  - target:
      kind: Ingress
      name: otlp-tls
    patch: |-
      - op: replace
        path: /spec/tls/0/hosts/0
        value: l2-mk6a4.brazilsouth.cloudapp.azure.com
      - op: replace
        path: /spec/rules/0/host
        value: l2-mk6a4.brazilsouth.cloudapp.azure.com
