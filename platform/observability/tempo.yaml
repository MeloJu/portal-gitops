# Tempo: armazena os traces. Recebe OTLP do Collector e gera métricas a partir dos spans
# (service graph e latência por span), que vão para o Prometheus por remote write.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tempo
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: tempo
    targetRevision: 1.24.4
    helm:
      releaseName: tempo
      valuesObject:
        fullnameOverride: tempo
        tempo:
          retention: 48h
          receivers:
            otlp:
              protocols:
                grpc:
                  endpoint: 0.0.0.0:4317
                http:
                  endpoint: 0.0.0.0:4318
          metricsGenerator:
            enabled: true
            storage:
              # Com `remote_write` aqui o chart ignora `remoteWriteUrl`. `send_exemplars` leva o
              # traceID de cada ponto da latência por span, e é isso que liga o p95 ao trace.
              remote_write:
                - url: http://kps-prometheus.observability:9090/api/v1/write
                  send_exemplars: true
          # Só habilitar o generator não basta: os processadores são ligados por tenant. Sem isto o
          # painel "Mapa de serviços" fica vazio (traefik -> l2-api -> postgres).
          overrides:
            defaults:
              metrics_generator:
                processors:
                  - service-graphs
                  - span-metrics
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
        persistence:
          enabled: true
          size: 2Gi
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
