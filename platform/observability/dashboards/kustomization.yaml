apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: observability

# Um ConfigMap por dashboard; o sidecar do Grafana carrega tudo que tem o label grafana_dashboard.
configMapGenerator:
  - name: dashboard-lumi-overview
    files:
      - lumi-overview.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
