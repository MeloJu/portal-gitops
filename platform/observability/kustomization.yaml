apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# As Applications e o PodMonitor do Traefik; o conteúdo de dashboards/ é renderizado pela
# Application dos dashboards.
resources:
  - kube-prometheus-stack.yaml
  - tempo.yaml
  - otel-collector.yaml
  - dashboards-application.yaml
  # Não é Application: o app-of-apps aplica direto (scrape do Traefik, que vive no kube-system).
  - traefik-podmonitor.yaml
