# A rota pública do OTLP numa Application própria: depende do Service do Collector e dos CRDs do Traefik.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability-otlp
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: https://github.com/MeloJu/portal-gitops.git
    targetRevision: develop
    path: platform/observability/otlp
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
