# cert-manager: emite e renova certificados TLS a partir de um Issuer. No local o emissor é
# self-signed (o navegador avisa, e isso é esperado); Let's Encrypt só entra quando houver
# um domínio público (ambiente oracle, fora do escopo por enquanto).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  annotations:
    # Antes da aplicação e dos Issuers: os CRDs precisam existir.
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: https://charts.jetstack.io
    chart: cert-manager
    targetRevision: v1.21.2
    helm:
      releaseName: cert-manager
      valuesObject:
        crds:
          enabled: true
          # Apagar o chart não pode apagar os CRDs (levaria todos os Certificates junto).
          keep: true
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 128Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
