name: PR validate

# Valida os manifests antes do merge. Os jobs são independentes: um vermelho não esconde o outro.
on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

# Menor privilégio: o CI só lê o código.
permissions:
  contents: read

concurrency:
  group: pr-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    name: kustomize build + kubeconform
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Falha se algum overlay não renderiza. Overlay que ainda não existe é ignorado.
      - name: kustomize build de cada overlay
        run: |
          mkdir -p rendered
          for dir in apps/l2/overlays/*/; do
            name="$(basename "$dir")"
            echo "::group::${name}"
            kubectl kustomize "$dir" > "rendered/${name}.yaml"
            echo "${name}: $(grep -c '^kind:' "rendered/${name}.yaml") recursos"
            echo "::endgroup::"
          done

      # Sem tag latest nem imagem sem tag/digest renderizada: o bump automático existe para isso.
      - name: Imagens sem tag fixa
        run: |
          if grep -hE '^\s+image:' rendered/*.yaml | grep -vE '@sha256:|:[A-Za-z0-9._-]+$'; then
            echo "::error::imagem sem tag ou digest"; exit 1
          fi
          if grep -hE '^\s+image:.*:latest$' rendered/*.yaml; then
            echo "::error::imagem com tag latest"; exit 1
          fi

      - name: kubeconform (-strict)
        run: |
          for f in rendered/*.yaml; do
            docker run --rm -v "$PWD/rendered:/in:ro" ghcr.io/yannh/kubeconform:v0.8.0 \
              -summary -strict -kubernetes-version 1.35.0 "/in/$(basename "$f")"
          done

  yamllint:
    name: yamllint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install yamllint==1.37.1
      - run: yamllint -c .yamllint.yaml apps bootstrap .github

  gitleaks:
    name: gitleaks (segredos no Git)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  no-plain-secrets:
    name: Nenhum Secret em claro
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # base64 não é criptografia: kind: Secret só é aceito no overlay ci (descartável).
      # Em produção o segredo entra como SealedSecret.
      - name: kind Secret fora do overlay ci
        run: |
          bad="$(grep -rlE '^kind:\s*Secret\s*$' apps bootstrap platform 2>/dev/null | grep -v '^apps/l2/overlays/ci/' || true)"
          if [ -n "$bad" ]; then
            echo "::error::Secret em claro no Git (use SealedSecret): $bad"; exit 1
          fi
