name: PR validate

# Valida os manifests antes do merge. Os jobs são independentes: um vermelho não esconde o outro.
on:
  # Qualquer base (PRs empilhados também validam) e `edited`: quando o GitHub retarga um PR
  # para develop depois do merge do PR de baixo, só o `edited` dispara. Sem ele os checks
  # obrigatórios ficavam "Waiting for status" para sempre.
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main, develop]

# Menor privilégio: o CI só lê o código.
permissions:
  contents: read

concurrency:
  group: pr-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitflow:
    name: Gitflow (origem do PR)
    # Só faz sentido em pull request; no push o job é pulado (e um check pulado conta como verde).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      # head_ref/base_ref entram por env: nunca interpolar nome de branch direto no script.
      - name: Origem permitida para a branch de destino
        env:
          HEAD: ${{ github.head_ref }}
          BASE: ${{ github.base_ref }}
        run: |
          case "$BASE" in
            main)
              # produção: só o que já passou pela integração, ou uma correção urgente
              [[ "$HEAD" == "develop" || "$HEAD" =~ ^(release|hotfix)/ ]] ||
                { echo "::error::PR para main só vem de develop, release/* ou hotfix/* (veio de '$HEAD')"; exit 1; }
              ;;
            develop)
              [[ "$HEAD" == "main" || "$HEAD" =~ ^(feature|fix|chore|docs|refactor|release|hotfix)/ ]] ||
                { echo "::error::branch '$HEAD' fora do padrão: use feature/*, fix/*, chore/*, docs/* ou refactor/*"; exit 1; }
              ;;
          esac
          echo "ok: $HEAD -> $BASE"

  render:
    name: kustomize build + kubeconform
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Falha se algum overlay não renderiza. Overlay que ainda não existe é ignorado.
      - name: kustomize build de cada overlay
        run: |
          mkdir -p rendered
          for dir in apps/l2/overlays/*/; do
            name="$(basename "$dir")"
            echo "::group::${name}"
            kubectl kustomize "$dir" > "rendered/${name}.yaml"
            echo "${name}: $(grep -c '^kind:' "rendered/${name}.yaml") recursos"
            echo "::endgroup::"
          done

      # O app-of-apps referencia platform/* por caminho relativo; um caminho errado só estoura
      # no cluster. Aqui só renderiza (os CRDs do Argo/K3s não têm schema no kubeconform).
      - name: kustomize build do app-of-apps e da plataforma
        run: |
          mkdir -p rendered-platform
          for dir in bootstrap/apps/*/ platform/*/ platform/*/*/; do
            [ -f "${dir}kustomization.yaml" ] || continue
            name="$(echo "${dir%/}" | tr '/' '_')"
            kubectl kustomize "$dir" > "rendered-platform/${name}.yaml" && echo "ok  ${dir}"
          done

      # Sem tag latest nem imagem sem tag/digest renderizada: o bump automático existe para isso.
      - name: Imagens sem tag fixa
        run: |
          if grep -hE '^\s+image:' rendered/*.yaml | grep -vE '@sha256:|:[A-Za-z0-9._-]+$'; then
            echo "::error::imagem sem tag ou digest"; exit 1
          fi
          if grep -hE '^\s+image:.*:latest$' rendered/*.yaml; then
            echo "::error::imagem com tag latest"; exit 1
          fi

      # CRDs (ServiceMonitor, Application do Argo, ClusterIssuer, HelmChartConfig...) validados
      # pelo catálogo público de schemas; o que não estiver lá falha, não é pulado em silêncio.
      - name: kubeconform (-strict, com schemas de CRDs)
        env:
          CRDS_CATALOG: https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json
        run: |
          for f in rendered/*.yaml rendered-platform/*.yaml; do
            dir="$(dirname "$f")"
            docker run --rm -v "$PWD/${dir}:/in:ro" ghcr.io/yannh/kubeconform:v0.8.0 \
              -summary -strict -kubernetes-version 1.35.0 \
              -schema-location default -schema-location "$CRDS_CATALOG" \
              "/in/$(basename "$f")"
          done

  checkov:
    name: Checkov (segurança dos manifests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Analisa o que o ArgoCD realmente aplica (o overlay renderizado), não o YAML cru da base.
      - name: Renderiza os overlays
        run: |
          mkdir -p rendered
          for dir in apps/l2/overlays/*/; do
            kubectl kustomize "$dir" > "rendered/$(basename "$dir").yaml"
          done

      # HARD-FAIL: pods privilegiados, root, sem limites, sem probes, etc. barram o PR.
      # O que é inevitável por causa da imagem (uid fixo, tag em vez de digest, segredo por
      # ambiente) está justificado em `checkov.io/skipN` no próprio manifesto, com o motivo.
      # Sem exceções na linha de comando: tudo que falhar barra o PR.
      - name: Checkov
        run: |
          docker run --rm -v "$PWD/rendered:/rl:ro" bridgecrew/checkov:3.2.500 \
            -d /rl --framework kubernetes --compact --quiet

  yamllint:
    name: yamllint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install yamllint==1.37.1
      - run: yamllint -c .yamllint.yaml apps bootstrap platform .github

  gitleaks:
    name: gitleaks (segredos no Git)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  no-plain-secrets:
    name: Nenhum Secret em claro
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # base64 não é criptografia: kind: Secret só é aceito no overlay ci (descartável).
      # Em produção o segredo entra como SealedSecret.
      - name: kind Secret fora do overlay ci
        run: |
          bad="$(grep -rlE '^kind:\s*Secret\s*$' apps bootstrap platform 2>/dev/null | grep -v '^apps/l2/overlays/ci/' || true)"
          if [ -n "$bad" ]; then
            echo "::error::Secret em claro no Git (use SealedSecret): $bad"; exit 1
          fi
