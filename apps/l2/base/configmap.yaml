# Configuração não sensível da l2-api. O que é sensível (JWT_SECRET, senhas) vem do Secret
# `l2-secrets`, que NUNCA fica em claro no Git: SealedSecret no oracle, criado pelo script
# de bootstrap no local, Secret descartável só no overlay ci.
apiVersion: v1
kind: ConfigMap
metadata:
  name: l2-config
  labels:
    app.kubernetes.io/name: l2-config
    app.kubernetes.io/part-of: l2
data:
  # O host `postgres` é o Service: DNS interno, nunca IP. O Flyway cria o schema no boot.
  DB_URL: jdbc:postgresql://postgres:5432/l2
  DB_USER: l2_app
  # Cada overlay sobrescreve com o endereço público.
  PUBLIC_BASE_URL: http://l2.localhost
  # Cookie de sessão só por HTTPS; o overlay local desliga porque não tem TLS.
  SESSION_COOKIE_SECURE: "true"
  # Spring só liga os grupos liveness/readiness sozinho ao detectar Kubernetes; explícito evita surpresa.
  MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
  # Agente OpenTelemetry (já vem na imagem, desligado por padrão): traces da API e do JDBC
  # (as queries no Postgres viram spans filhos) para o Collector, que repassa ao Tempo.
  OTEL_SDK_DISABLED: "false"
  OTEL_SERVICE_NAME: l2-api
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.observability:4318
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  # Continua o trace de quem chamou (Traefik, browser); sem pai, amostra tudo. Demo: 100%.
  OTEL_TRACES_SAMPLER: parentbased_always_on
  # Métricas vão pelo scrape do Prometheus (/actuator/prometheus); logs ficam no stdout.
  OTEL_METRICS_EXPORTER: none
  OTEL_LOGS_EXPORTER: none
  # Sem histograma o Prometheus só tem média de latência; com ele, p50/p95/p99 por rota.
  MANAGEMENT_METRICS_DISTRIBUTION_PERCENTILES_HISTOGRAM_HTTP_SERVER_REQUESTS: "true"
