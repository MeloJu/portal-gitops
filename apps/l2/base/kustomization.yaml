apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Ordem lógica; o ArgoCD aplica pelo grafo de dependências e o namespace sai primeiro.
resources:
  - namespace.yaml
  - postgres-pvc.yaml
  - postgres.yaml
  - api.yaml
  - api-hpa.yaml
  - api-servicemonitor.yaml
  - tools-api.yaml
  - frontend.yaml
  - ingress.yaml

# ConfigMap com hash no nome: mudar um valor reinicia a API sozinho (ver l2-config.env).
configMapGenerator:
  - name: l2-config
    envs:
      - l2-config.env
    options:
      labels:
        app.kubernetes.io/name: l2-config
        app.kubernetes.io/part-of: l2

# O Secret `l2-secrets` NÃO está aqui de propósito. Cada overlay fornece o seu:
#   local  -> criado pelo scripts/bootstrap-local.sh (fora do Git)
#   oracle -> SealedSecret
#   ci     -> Secret descartável
