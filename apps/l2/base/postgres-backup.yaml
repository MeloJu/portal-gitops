# Backup diário do banco l2 com pg_dump (formato custom, compactado) num PVC próprio.
#
# - Roda como `l2_app`, dona do banco e de todas as tabelas: dump completo sem usar o superuser.
# - Cada dump é VALIDADO com `pg_restore --list` antes de contar: backup que não abre não é backup.
# - Mantém os 7 mais recentes. Escreve em .tmp e só renomeia no fim: um dump pela metade nunca vira "o último".
#
# Disparar na hora (teste/antes de uma mudança arriscada):
#   kubectl -n l2 create job --from=cronjob/postgres-backup backup-manual-$(date +%s)
# Restaurar: ver docs/backup.md.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-backup
  labels:
    app.kubernetes.io/name: postgres-backup
    app.kubernetes.io/part-of: l2
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  annotations:
    checkov.io/skip1: "CKV_K8S_40=uid 70 do usuario postgres da imagem alpine (mesma imagem do banco, que traz o pg_dump)"
  labels:
    app.kubernetes.io/name: postgres-backup
    app.kubernetes.io/part-of: l2
spec:
  schedule: "0 3 * * *"
  timeZone: America/Sao_Paulo
  # Dois backups ao mesmo tempo disputariam o mesmo volume.
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: postgres-backup
            app.kubernetes.io/part-of: l2
        spec:
          serviceAccountName: postgres-backup
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 70
            runAsGroup: 70
            fsGroup: 70
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: pg-dump
              # Mesma imagem (e versão) do banco: pg_dump e servidor na mesma major.
              image: postgres@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  export PGPASSWORD="$(cat /run/secrets/l2/app-password)"
                  # Pod novo sob NetworkPolicy: o kube-router leva alguns segundos para liberar o IP dele, e
                  # uma conexão imediata leva "Connection refused". Retry do Job não ajuda (cada um é um pod
                  # novo, na mesma corrida); esperar o banco aceitar a conexão resolve.
                  ok=""
                  for i in $(seq 1 30); do
                    if pg_isready -h postgres -U l2_app -d l2 -t 2 > /dev/null; then ok=1; break; fi
                    sleep 2
                  done
                  [ -n "$ok" ] || { echo "Postgres não respondeu em 60 s"; exit 1; }
                  file="/backup/l2-$(date -u +%Y%m%dT%H%M%SZ).dump"
                  pg_dump -h postgres -U l2_app -d l2 --format=custom --file="${file}.tmp"
                  pg_restore --list "${file}.tmp" > /dev/null
                  mv "${file}.tmp" "$file"
                  ls -1t /backup/l2-*.dump | tail -n +8 | xargs -r rm -f
                  echo "backup ok: $file ($(du -h "$file" | cut -f1))"
                  ls -1t /backup/l2-*.dump
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
              volumeMounts:
                - name: backup
                  mountPath: /backup
                - name: secrets
                  mountPath: /run/secrets/l2
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: backup
              persistentVolumeClaim:
                claimName: postgres-backup
            - name: secrets
              secret:
                secretName: l2-secrets
                defaultMode: 0440
                items:
                  - key: DB_PASSWORD
                    path: app-password
            - name: tmp
              emptyDir: {}
