# Uma ServiceAccount por workload, sem token montado: nenhum pod daqui fala com a API do Kubernetes.
# Sem isso todos usariam a `default` do namespace, e uma permissão dada a um vazaria para todos.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: l2-api
  labels:
    app.kubernetes.io/name: l2-api
    app.kubernetes.io/part-of: l2
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: frontend
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: l2
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tools-api
  labels:
    app.kubernetes.io/name: tools-api
    app.kubernetes.io/part-of: l2
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: l2
automountServiceAccountToken: false
