# Frontend: build do Vite servido por nginx-unprivileged (8080). O nginx também repassa
# /tools/ para a tools-api.
apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: l2
spec:
  selector:
    app.kubernetes.io/name: frontend
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: l2
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
        app.kubernetes.io/part-of: l2
    spec:
      automountServiceAccountToken: false
      securityContext:
        # uid 101 = usuário `nginx` da imagem nginx-unprivileged.
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: ghcr.io/meloju/portal-app-frontend
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8080
          env:
            # O nginx resolve este nome ao iniciar: se o Service não existir, ele nem sobe
            # ("host not found in upstream"). Basta o Service existir; o pod da tools-api pode estar fora.
            - name: TOOLS_API_URL
              value: http://tools-api:3001
            # O nginx também repassa /api/ e /r/ para a API (mesmo papel do proxy do Vite). No
            # cluster o Ingress já manda essas rotas direto para a l2-api, mas o nginx resolve o nome
            # na partida: o padrão da imagem (`http://backend:8080`) não existe aqui e o pod não sobe.
            - name: API_URL
              value: http://l2-api:8080
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          volumeMounts:
            # O entrypoint renderiza o template em /etc/nginx/conf.d/default.conf ao iniciar;
            # com o root somente leitura isso precisa de um volume gravável. /tmp guarda pid e temporários.
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: nginx-conf
          emptyDir: {}
        - name: tmp
          emptyDir: {}
