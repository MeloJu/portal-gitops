# SOMENTE para o smoke test no kind: valores descartáveis, sem valor fora do cluster efêmero.
# É a única exceção a "Secret nunca em claro no Git" (liberada no gitleaks por caminho).
apiVersion: v1
kind: Secret
metadata:
  name: l2-secrets
  labels:
    app.kubernetes.io/part-of: l2
type: Opaque
stringData:
  POSTGRES_PASSWORD: ci-only-postgres-password
  DB_PASSWORD: ci-only-app-password
  # A app exige >= 32 bytes.
  JWT_SECRET: ci-only-not-a-secret-ci-only-not-a-secret-0123456789
