apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# VM Azure com K3s (terraform/). Host = o `fqdn` que o Terraform imprime (DNS grátis da Azure),
# o que permite HTTPS de verdade (Let's Encrypt) sem comprar domínio.
namespace: l2
resources:
  - ../../base
  # O Secret `l2-secrets` entra cifrado: só o controller deste cluster o abre. Valores aleatórios,
  # selados com scripts/seal-secret.sh (docs/azure.md e docs/sealed-secrets.md).
  - sealed-secret.yaml
  - network-policy-acme.yaml

# As imagens do Azure NÃO seguem o bump automático (que edita o overlay `local`): a promoção é
# deliberada, copiando este bloco a partir do `local` depois que a versão provou-se lá (task D5).
images:
  - name: ghcr.io/meloju/portal-app-backend
    newTag: sha-c546009
    digest: sha256:8f770d33ed1e8b5a724d3330858279962fe1cad71a4dcbf2d1eb04710eba96e2
  - name: ghcr.io/meloju/portal-app-frontend
    newTag: sha-c546009
    digest: sha256:bdec277e069a5d7ec4df1b3c1973ed58ddfec9dd22beef54817e478cc88f17d1
  - name: ghcr.io/meloju/portal-app-tools-api
    newTag: sha-c546009
    digest: sha256:4a52906a6529b5d060f0d4c7f113e594106c462477e3f30bb5e33de0bf2c4783
configMapGenerator:
  - name: l2-config
    behavior: merge
    literals:
      # Os links curtos nascem neste endereço (o DuckDNS é o "nome bonito"; o do Azure fica de reserva).
      - PUBLIC_BASE_URL=https://lumilinks.duckdns.org
      # HTTPS de verdade: o cookie de sessão só trafega por TLS.
      - SESSION_COOKIE_SECURE=true
      # Separa os traces por ambiente no Tempo/Grafana.
      - OTEL_RESOURCE_ATTRIBUTES=deployment.environment=azure
patches:
  - target:
      kind: Ingress
      name: l2
    patch: |-
      - op: add
        path: /spec/rules/0/host
        value: lumilinks.duckdns.org
      # Reserva: o nome da Azure continua respondendo (se o DuckDNS cair, o site segue no ar).
      - op: add
        path: /spec/rules/-
        value:
          host: l2-mk6a4.brazilsouth.cloudapp.azure.com
          http:
            paths:
              - path: /api/
                pathType: Prefix
                backend:
                  service:
                    name: l2-api
                    port:
                      name: http
              - path: /r/
                pathType: Prefix
                backend:
                  service:
                    name: l2-api
                    port:
                      name: http
              - path: /
                pathType: Prefix
                backend:
                  service:
                    name: frontend
                    port:
                      name: http
      # Adiciona SÓ esta chave: `add /metadata/annotations` com um mapa substituiria as anotações da base
      # (e o middleware de rate limit sumiria). No JSON Pointer, a "/" do nome da chave vira "~1".
      - op: add
        path: /metadata/annotations/cert-manager.io~1cluster-issuer
        value: letsencrypt
      - op: add
        path: /spec/tls
        value:
          # Um certificado só, com os dois nomes.
          - hosts:
              - lumilinks.duckdns.org
              - l2-mk6a4.brazilsouth.cloudapp.azure.com
            secretName: l2-tls
  # Uma VM só (2 vCPU): até 3 réplicas da API cabem, e o HPA continua sendo a cena da demo.
  - target:
      kind: HorizontalPodAutoscaler
      name: l2-api
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 3
