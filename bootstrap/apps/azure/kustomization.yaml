apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - project.yaml
  - project-platform.yaml
  # Mesma camada de plataforma do cluster local; abaixo só mudam o que depende do ambiente.
  - ../../../platform/sealed-secrets
  - ../../../platform/cert-manager
  - ../../../platform/traefik
  - ../../../platform/observability
  - l2.yaml

patches:
  # Let's Encrypt no lugar do self-signed.
  - target:
      kind: Application
      name: cert-manager-issuers
    patch: |-
      - op: replace
        path: /spec/source/path
        value: platform/cert-manager/issuers-azure
  # Mesma rota pública de traces, com o host do Azure.
  - target:
      kind: Application
      name: observability-otlp
    patch: |-
      - op: replace
        path: /spec/source/path
        value: platform/observability/otlp-azure
  # O Grafana NÃO fica na internet: o acesso é por túnel SSH + port-forward (docs/azure.md).
  - target:
      kind: Application
      name: kube-prometheus-stack
    patch: |-
      - op: replace
        path: /spec/source/helm/valuesObject/grafana/ingress/enabled
        value: false
