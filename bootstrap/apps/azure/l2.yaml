apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: l2-azure
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: l2
  source:
    repoURL: https://github.com/MeloJu/portal-gitops.git
    # Por enquanto o Azure também segue a `develop` (um time pequeno, sem ambiente de produção
    # separado). Quando houver gate de promoção (D5), isto passa a ser `main`.
    targetRevision: develop
    path: apps/l2/overlays/azure
  destination:
    server: https://kubernetes.default.svc
    namespace: l2
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
  # O HPA é quem decide as réplicas da API; o Argo não deve brigar com ele.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: l2-api
      jsonPointers:
        - /spec/replicas
