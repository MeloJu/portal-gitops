apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Instalação do ArgoCD com a versão fixada. É a ÚNICA coisa aplicada à mão no cluster;
# daqui em diante o repositório é a fonte da verdade (app-of-apps em bootstrap/apps/*).
# Aplicar com --server-side: os CRDs do Argo passam do limite de annotation do apply client-side.
namespace: argocd

resources:
  - namespace.yaml
  - https://raw.githubusercontent.com/argoproj/argo-cd/v3.5.5/manifests/install.yaml
